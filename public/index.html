<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CODE QUEST — تعلّم لغة المبرمجين</title>
  <meta name="description" content="CODE QUEST — لعبة تعليمية تفاعلية لإتقان المصطلحات البرمجية الإنجليزية." />
  <meta name="theme-color" content="#081426" />
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-lines"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div id="auth-screen" class="auth-screen hidden"></div>

  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home" aria-label="CODE QUEST">
        <img src="/assets/logo.svg" alt="" class="brand-logo" />
        <span class="brand-text">
          <strong>CODE<em>QUEST</em></strong>
          <small id="brand-tagline" data-i18n="brandTagline">تعلّم لغة المبرمجين</small>
        </span>
      </a>
      <nav class="nav" id="main-nav">
        <a href="#/home" data-nav="home"><span class="nav-ico">🏠</span><span data-i18n="home">الرئيسية</span></a>
        <a href="#/worlds" data-nav="worlds"><span class="nav-ico">🗺️</span><span data-i18n="worlds">العوالم</span></a>
        <a href="#/review" data-nav="review"><span class="nav-ico">🔁</span><span data-i18n="review">المراجعة الذكية</span><b class="nav-badge" id="review-badge" hidden></b></a>
        <a href="#/bosses" data-nav="bosses"><span class="nav-ico">⚔️</span><span data-i18n="bosses">الزعماء</span></a>
        <a href="#/multiplayer" data-nav="multiplayer"><span class="nav-ico">🎮</span><span data-i18n="multiplayer">اللعب الجماعي</span></a>
        <a href="#/dictionary" data-nav="dictionary"><span class="nav-ico">📖</span><span data-i18n="dictionary">القاموس</span></a>
        <a href="#/leaderboard" data-nav="leaderboard"><span class="nav-ico">🏆</span><span data-i18n="leaderboard">لوحة الصدارة</span></a>
        <a href="#/achievements" data-nav="achievements"><span class="nav-ico">🎖️</span><span data-i18n="achievements">الإنجازات</span></a>
        <a href="#/shop" data-nav="shop"><span class="nav-ico">🛍️</span><span data-i18n="shop">المتجر</span></a>
        <a href="#/subscription" data-nav="subscription"><span class="nav-ico">💳</span><span data-i18n="subscription">الاشتراك</span></a>
        <a href="#/profile" data-nav="profile"><span class="nav-ico">👤</span><span data-i18n="profile">ملفي</span></a>
      </nav>
      <div class="sidebar-footer">
        <button class="icon-btn" id="theme-toggle" data-i18n-title="themeToggle" title="تبديل المظهر">🌙</button>
        <button class="icon-btn" id="lang-toggle" data-i18n-title="langToggle" title="تبديل اللغة">EN</button>
        <button class="icon-btn" id="sound-toggle" data-i18n-title="soundToggle" title="الصوت">🔊</button>
        <a class="icon-btn admin-link hidden" id="admin-link" href="/admin" data-i18n-title="adminPanel" title="لوحة الإدارة">🛠️</a>
        <a class="icon-btn" id="about-link" href="#/about" data-i18n-title="aboutTitle" title="عن المصمم">ℹ️</a>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" data-i18n-title="menu" aria-label="القائمة">☰</button>
        <div class="player-mini" id="player-mini"></div>
        <div class="topbar-spacer"></div>
        <a class="stat-chip trial-chip hidden" id="trial-chip" href="#/subscription" title=""></a>
        <div class="stat-chip xp" data-i18n-title="xpTitle" title="نقاط الخبرة"><span>⚡</span><b id="top-xp">0</b><small>XP</small></div>
        <div class="stat-chip coins" data-i18n-title="coinsTitle" title="العملات"><span>🪙</span><b id="top-coins">0</b></div>
        <div class="stat-chip streak" data-i18n-title="streakTitle" title="سلسلة الأيام"><span>🔥</span><b id="top-streak">0</b></div>
        <a class="avatar-btn" href="#/profile" id="top-avatar"><span>N</span></a>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="bottom-nav" id="bottom-nav">
        <a href="#/home" data-nav="home"><span>🏠</span><small data-i18n="home">الرئيسية</small></a>
        <a href="#/worlds" data-nav="worlds"><span>🗺️</span><small data-i18n="worlds">العوالم</small></a>
        <a href="#/multiplayer" data-nav="multiplayer"><span>🎮</span><small data-i18n="multiplayer">جماعي</small></a>
        <a href="#/review" data-nav="review"><span>🔁</span><small data-i18n="review">مراجعة</small></a>
        <a href="#/dictionary" data-nav="dictionary"><span>📖</span><small data-i18n="dictionary">القاموس</small></a>
        <a href="#/profile" data-nav="profile"><span>👤</span><small data-i18n="profile">ملفي</small></a>
      </nav>
    </div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root" class="modal-root hidden"></div>
  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
